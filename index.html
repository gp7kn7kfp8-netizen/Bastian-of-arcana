<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bastion of the Arcana</title>
<style>
:root{--bg:#0a0e1a;--panel:#141b2e;--panel2:#1c2540;--line:#2b3658;--text:#eef1ff;--mut:#8e9bc0;--gold:#f5c542;--acc:#7c5cff;--sky:#38bdf8;--common:#94a3b8;--rare:#38bdf8;--epic:#c084fc;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(180deg,#1a2240,#111830);border-bottom:1px solid var(--line)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:flex;gap:4px;align-items:center;background:#0b1020;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:.85rem}
.ibtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:1.1rem;padding:6px 10px;color:var(--text)}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;padding:14px;display:none}
.view.on{display:block}
nav{display:flex;background:#0f1528;border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 10px;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button b{font-size:1.35rem}
nav button.on{color:#fff}
nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.banner{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#1e2750,#141b2e);border:1px solid var(--acc);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.banner h2{font-size:1.05rem;color:#c4b5fd}.banner p{font-size:.8rem;color:var(--mut);margin-top:2px}
.wave{background:var(--acc);border-radius:10px;padding:6px 12px;font-weight:800}
canvas{width:100%;height:auto;display:block;border-radius:14px;border:2px solid var(--line);margin-bottom:12px}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:1rem;color:#fff;background:linear-gradient(135deg,#7c5cff,#5b3fe0)}
.btn.gem{background:linear-gradient(135deg,#0ea5e9,#2563eb)}
.btn.dark{background:var(--panel2);border:1px solid var(--line)}
.btn:active,.buy:active{transform:scale(.97)}
.btn:disabled,.buy:disabled{opacity:.4}
.h{font-size:1.25rem;font-weight:800}.sub{font-size:.82rem;color:var(--mut);margin:2px 0 12px}
.row{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.ico{font-size:1.6rem;width:46px;height:46px;display:grid;place-items:center;background:var(--panel2);border-radius:12px;flex:none}
.info{flex:1;min-width:0}.info h4{font-size:.95rem}.info p{font-size:.78rem;color:var(--mut);margin-top:2px}
.lv{color:var(--gold);font-size:.75rem;margin-left:6px}
.buy{border:0;border-radius:10px;padding:10px 12px;min-width:84px;font-weight:800;color:#fff;background:linear-gradient(135deg,#16a34a,#15803d)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{aspect-ratio:3/4;border-radius:12px;border:2px solid var(--c);background:linear-gradient(160deg,var(--panel2),var(--panel));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:6px;position:relative}
.tile b{font-size:.74rem}.tile small{font-size:.68rem;color:var(--mut);text-transform:capitalize}.tile .big{font-size:1.9rem}
.tile.lock{filter:grayscale(1);opacity:.45}
.common{--c:var(--common)}.rare{--c:var(--rare)}.epic{--c:var(--epic);box-shadow:0 0 12px rgba(192,132,252,.35)}
.new{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#000;font-size:.6rem;font-weight:800;padding:2px 5px;border-radius:6px}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:800;text-align:center;white-space:nowrap}
.badge small{display:block;font-size:.65rem;color:var(--mut);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.ov.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--acc);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:85%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal h3{color:#c4b5fd}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#0b1020;border:1px solid var(--acc);padding:10px 16px;border-radius:999px;font-size:.85rem;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head>
<body><div id="app">
<header>
<div class="pills"><div class="pill">🪙<span id="g-gold"></span></div><div class="pill">💎<span id="g-gems"></span></div><div class="pill">🧪<span id="g-ores"></span></div><div class="pill">⚡<span id="g-stones"></span></div></div>
<button class="ibtn" onclick="openM('m-save')" aria-label="Save">💾</button>
</header>
<main>
<section class="view on" id="v-home">
<div class="banner"><div><h2 id="tier"></h2><p id="bonus"></p></div><div class="wave" id="wave"></div></div>
<canvas id="cv" width="400" height="400"></canvas>
<div class="btns"><button class="btn" onclick="startWave()">⚔️ Start Wave</button><button class="btn gem" id="ad" onclick="claimAd()"></button></div>
</section>
<section class="view" id="v-work"><div class="h">Citadel Workshop</div><div class="sub">Spend gold to strengthen your tower.</div><div id="work"></div></section>
<section class="view" id="v-cards"><div class="h">Arcane Cards</div><div class="sub" id="ccount"></div>
<button class="btn buy" style="width:100%;margin-bottom:12px;padding:14px;background:linear-gradient(135deg,#0ea5e9,#2563eb)" data-cur="gems" data-cost="100" onclick="pull()">✨ Summon ×10 · 💎 100</button><div class="grid" id="cgrid"></div></section>
<section class="view" id="v-weap"><div class="h">Ultimate Weapons</div><div class="sub">Unlock devastating powers with power stones.</div><div id="weap"></div></section>
<section class="view" id="v-store"><div class="h">Arcane Store</div><div class="sub">Purchases are not available yet.</div><div id="store"></div></section>
</main>
<nav>
<button class="on" data-v="home" onclick="go('home')"><b>🏰</b>Defend</button>
<button data-v="work" onclick="go('work')"><b>🛠️</b>Workshop</button>
<button data-v="cards" onclick="go('cards')"><b>🃏</b>Cards</button>
<button data-v="weap" onclick="go('weap')"><b>⚔️</b>Weapons</button>
<button data-v="store" onclick="go('store')"><b>🛒</b>Store</button>
</nav></div>
<div class="ov" id="m-save"><div class="modal"><h3>Save Game</h3><p class="sub" style="margin:0">Progress autosaves on this device and browser.</p>
<div class="btns"><button class="btn" onclick="manualSave()">Save now</button><button class="btn dark" id="rst" onclick="resetGame()">Reset progress</button></div>
<button class="btn dark" onclick="closeM('m-save')">Close</button></div></div>
<div class="ov" id="m-pull"><div class="modal" style="text-align:center"><h3>Arcane Summoning</h3><div class="grid" id="pgrid"></div><button class="btn" onclick="closeM('m-pull')">Awesome!</button></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const W=400,H=400,TX=46,TY=200;
const UPS=[{k:'health',n:'Tower Health',i:'❤️',d:'Tougher fortress walls.'},{k:'regen',n:'Regeneration',i:'💚',d:'Heal over time.'},{k:'damage',n:'Spell Damage',i:'🔮',d:'Stronger magic bolts.'},{k:'crit',n:'Critical Strike',i:'💥',d:'Chance to deal triple damage.'},{k:'range',n:'Attack Range',i:'🎯',d:'Hit enemies from further away.'}];
const STAT={health:()=>maxHp()+' HP',regen:()=>regen().toFixed(1)+' HP/s',damage:()=>dmg().toFixed(1),crit:()=>Math.round(crit()*100)+'%',range:()=>rng()+' px'};
const CARDS=[['🔥','Ember Sigil'],['❄️','Frost Rune'],['⚡','Storm Glyph'],['🛡️','Iron Ward'],['🌪️','Gale Charm'],['🗿','Stone Idol'],['🐍','Venom Fang'],['☀️','Sun Crest'],['🌙','Moon Veil'],['🐚','Tide Pearl'],['🌿','Thorn Seed'],['🏺','Ash Totem'],['🪞','Mirror Shard'],['🔔','Echo Bell'],['🕯️','Hex Candle'],['🐉','Dragon Scale'],['💀','Lich Phylactery'],['📖','Archmage Tome'],['🪶','Phoenix Feather'],['👁️','Void Eye'],['👑','Crown of Ages']];
const rar=i=>i<12?'common':i<18?'rare':'epic';
const TIERS=[['Wooden Outpost',0],['Stone Bastion',15],['Iron Citadel',35],['Mithril Stronghold',60],['Adamant Tower',100],['Celestial Spire',150],['Nether Keep',220],['Astral Sanctum',300],['Ethereal Pinnacle',400],['Omnipotent Throne',600]];
const WI=['☄️','⏳','✨','🌀','⚡','🌋'];
const STORE=[['1.5x Coin No Ads Pack + 500 Gems','Permanent multiplier and gem bundle','£5.00'],['2x Coin Pack Rare + 1000 Gems','Enhanced earnings and gems','£10.00'],['3x Coin Epic Pack + 5000 Gems','Ultimate multiplier boost','£20.00'],['500 Gem Pack','Instant summon currency','£2.00'],['1000 Gem Pack','Standard gem pouch','£5.00'],['3000 Gem Pack','Large gem chest','£10.00'],['Power Stones Pack (750)','Milestone upgrade stones','£25.00']];
const state={gold:150,gems:120,ores:25,stones:5,wave:1,citadelTier:1,adGemCooldown:0,
upgrades:{health:{level:1,cost:50},regen:{level:1,cost:75},damage:{level:1,cost:60},crit:{level:1,cost:100},range:{level:1,cost:80}},
cards:CARDS.map((c,i)=>({unlocked:i<3,level:1})),
weapons:[['Meteor Swarm',50,30],['Time Stop',100,45],['Divine Intervention',200,60],['Arcane Singularity',350,90],['Chain Lightning',500,40],['Realm Collapse',1000,120]].map((w,i)=>({id:i,name:w[0],cost:w[1],cooldown:w[2],level:0}))};
const tierOf=w=>Math.min(10,1+Math.floor((w-1)/5));
const maxHp=()=>100+(state.upgrades.health.level-1)*25;
const regen=()=>0.5+(state.upgrades.regen.level-1)*0.4;
const dmg=()=>1+(state.upgrades.damage.level-1)*0.6;
const crit=()=>Math.min(.6,.05+(state.upgrades.crit.level-1)*.03);
const rng=()=>Math.min(360,170+(state.upgrades.range.level-1)*18);
const fmt=n=>{n=Math.floor(n);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':n};
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
function openM(id){$(id).classList.add('on')}function closeM(id){$(id).classList.remove('on')}
function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function head(){$('g-gold').textContent=fmt(state.gold);$('g-gems').textContent=fmt(state.gems);$('g-ores').textContent=fmt(state.ores);$('g-stones').textContent=fmt(state.stones);
const t=TIERS[state.citadelTier-1];$('tier').textContent='Tier '+state.citadelTier+': '+t[0];$('bonus').textContent='Coin bonus +'+t[1]+'%';$('wave').textContent='Wave '+state.wave;
document.querySelectorAll('.buy').forEach(b=>b.disabled=state[b.dataset.cur]<+b.dataset.cost);updateAd()}
function updateAd(){const b=$('ad'),s=Math.ceil(state.adGemCooldown);if(s>0){b.textContent='⏳ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');b.disabled=true}else{b.textContent='💎 Free gems +25';b.disabled=false}}
function renderWork(){$('work').innerHTML=UPS.map(u=>{const x=state.upgrades[u.k];return `<div class="row"><div class="ico">${u.i}</div><div class="info"><h4>${u.n}<span class="lv">Lv ${x.level}</span></h4><p>${u.d}<br>Now: <b>${STAT[u.k]()}</b></p></div><button class="buy" data-cur="gold" data-cost="${x.cost}" onclick="buyUp('${u.k}')">🪙 ${x.cost}</button></div>`}).join('')}
function renderWeap(){$('weap').innerHTML=state.weapons.map(w=>`<div class="row"><div class="ico">${WI[w.id]}</div><div class="info"><h4>${w.name}<span class="lv">Lv ${w.level}</span></h4><p>Cooldown: ${w.cooldown}s</p></div><button class="buy" data-cur="stones" data-cost="${w.cost}" onclick="buyWeapon(${w.id})">⚡ ${w.cost}</button></div>`).join('')}
function tile(i,tag=''){const c=state.cards[i],u=c.unlocked;return `<div class="tile ${rar(i)}${u?'':' lock'}">${tag}<span class="big">${u?CARDS[i][0]:'🔒'}</span><b>${u?CARDS[i][1]:'???'}</b><small>${u?'Lv '+c.level:rar(i)}</small></div>`}
function renderCards(){$('ccount').textContent=state.cards.filter(c=>c.unlocked).length+' / 21 collected';$('cgrid').innerHTML=state.cards.map((c,i)=>tile(i)).join('')}
function renderAll(){renderWork();renderWeap();renderCards();head()}
$('store').innerHTML=STORE.map(s=>`<div class="row"><div class="info"><h4>${s[0]}</h4><p>${s[1]}</p></div><div class="badge">${s[2]}<small>Coming soon</small></div></div>`).join('');
function buyUp(k){const u=state.upgrades[k];if(state.gold<u.cost)return;state.gold-=u.cost;u.level++;u.cost=Math.floor(u.cost*1.35);if(k==='health')hp=Math.min(maxHp(),hp+25);renderAll();toast('Upgraded to level '+u.level)}
function buyWeapon(i){const w=state.weapons[i];if(state.stones<w.cost)return;state.stones-=w.cost;w.level++;w.cost=Math.floor(w.cost*1.5);renderAll();toast(w.name+' upgraded')}
function pull(){if(state.gems<100){toast('Not enough gems');return}state.gems-=100;let out='';
for(let n=0;n<10;n++){const r=Math.random(),[a,b]=r<.08?[18,20]:r<.3?[12,17]:[0,11],id=a+Math.floor(Math.random()*(b-a+1)),c=state.cards[id],isNew=!c.unlocked;if(isNew){c.unlocked=true;c.level=1}else c.level++;out+=tile(id,isNew?'<span class="new">NEW</span>':'')}
$('pgrid').innerHTML=out;renderAll();openM('m-pull')}
function claimAd(){if(state.adGemCooldown>0)return;state.gems+=25;state.adGemCooldown=600;head();toast('+25 gems')}
const SAVE_KEY='bastion-arcana-save-v1';let resetting=false;
function saveGame(){if(resetting)return false;try{localStorage.setItem(SAVE_KEY,JSON.stringify({gold:state.gold,gems:state.gems,ores:state.ores,stones:state.stones,wave:state.wave,adReadyAt:Date.now()+state.adGemCooldown*1000,upgrades:state.upgrades,cards:state.cards,weapons:state.weapons}));return true}catch(e){return false}}
function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return;const d=JSON.parse(raw);
['gold','gems','ores','stones','wave'].forEach(k=>{if(typeof d[k]==='number')state[k]=d[k]});state.citadelTier=tierOf(state.wave);
if(typeof d.adReadyAt==='number')state.adGemCooldown=Math.max(0,(d.adReadyAt-Date.now())/1000);
if(d.upgrades)Object.keys(state.upgrades).forEach(k=>{if(d.upgrades[k])state.upgrades[k]=d.upgrades[k]});
if(Array.isArray(d.cards)&&d.cards.length===21)state.cards=d.cards.map(c=>({unlocked:!!c.unlocked,level:c.level||1}));
if(Array.isArray(d.weapons)&&d.weapons.length===6)state.weapons.forEach((w,i)=>{w.level=d.weapons[i].level||0;w.cost=d.weapons[i].cost||w.cost})}catch(e){}}
function manualSave(){toast(saveGame()?'Saved on this device':'Could not save (storage unavailable)')}
let rc=false;function resetGame(){if(!rc){rc=true;$('rst').textContent='Tap again to confirm';setTimeout(()=>{rc=false;$('rst').textContent='Reset progress'},3000);return}resetting=true;try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload()}
setInterval(saveGame,3000);setInterval(updateAd,500);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});window.addEventListener('pagehide',saveGame);

const ctx=$('cv').getContext('2d');
let enemies=[],bolts=[],parts=[],hp=100,fireCd=0,flash=0,waveActive=false;
const STARS=Array.from({length:45},(_,i)=>[(i*97)%W,(i*53)%150,i%3?1:2,1+i%4]);
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,life:.5,max:.5,c})}
function float(x,y,txt,c){parts.push({x,y,vx:0,vy:-30,life:.9,max:.9,c,txt})}
function startWave(){if(waveActive){toast('Wave in progress');return}waveActive=true;const n=5+state.wave,h=2+state.wave*.7;
for(let i=0;i<n;i++)enemies.push({x:W+30+i*46,y:TY+Math.random()*70-25,hp:h,max:h,sp:38+Math.random()*14,ph:Math.random()*6})}
function kill(e){e.dead=true;const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);const r=Math.round(10*(1+TIERS[state.citadelTier-1][1]/100));state.gold+=r;float(e.x,e.y-14,'+'+r,'#f5c542');burst(e.x,e.y,'#fca5a5',10);head()}
function update(dt){
if(state.adGemCooldown>0)state.adGemCooldown=Math.max(0,state.adGemCooldown-dt);
hp=Math.min(maxHp(),hp+regen()*dt);flash=Math.max(0,flash-dt*3);
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.x-=e.sp*dt;if(e.x<=TX+28){hp-=8;flash=1;burst(e.x,e.y,'#ef4444',8);e.dead=true;enemies.splice(i,1)}}
fireCd-=dt;
if(fireCd<=0){let t=null,bd=1e9;for(const e of enemies){const d=e.x-TX;if(e.x<W&&d<=rng()&&d<bd){bd=d;t=e}}if(t){bolts.push({x:TX,y:TY-74,t});fireCd=.35}}
for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];if(b.t.dead){bolts.splice(i,1);continue}
const dx=b.t.x-b.x,dy=b.t.y-b.y,d=Math.hypot(dx,dy),s=480*dt;
if(d<=s+6){const c=Math.random()<crit();b.t.hp-=dmg()*(c?3:1);burst(b.t.x,b.t.y,c?'#fde68a':'#7dd3fc',c?10:5);if(c)float(b.t.x,b.t.y-20,'CRIT!','#fde68a');bolts.splice(i,1);if(b.t.hp<=0)kill(b.t)}
else{b.x+=dx/d*s;b.y+=dy/d*s}}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
if(hp<=0){enemies.length=0;bolts.length=0;waveActive=false;hp=maxHp();toast('Wave failed! Upgrade your tower and try again');return}
if(waveActive&&enemies.length===0){waveActive=false;toast('Wave '+state.wave+' cleared!');state.wave++;const t=tierOf(state.wave);if(t>state.citadelTier){state.citadelTier=t;toast('Citadel upgraded: '+TIERS[t-1][0]+'!')}head()}}
function draw(t){
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a1040');g.addColorStop(.55,'#35206e');g.addColorStop(1,'#0e1630');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff';STARS.forEach(s=>{ctx.globalAlpha=.3+.7*Math.abs(Math.sin(t*s[3]*.5+s[0]));ctx.fillRect(s[0],s[1],s[2],s[2])});ctx.globalAlpha=1;
ctx.shadowColor='#c4b5fd';ctx.shadowBlur=24;ctx.fillStyle='#ece6ff';ctx.beginPath();ctx.arc(330,70,20,0,7);ctx.fill();ctx.shadowBlur=0;
const gg=ctx.createLinearGradient(0,TY-35,0,H);gg.addColorStop(0,'#2a3a66');gg.addColorStop(1,'#101a33');ctx.fillStyle=gg;ctx.fillRect(0,TY-35,W,H-TY+35);
ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(0,TY-35,W,3);
ctx.strokeStyle='rgba(124,92,255,.3)';ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(TX,TY,rng(),-1,1);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='#4b5a85';ctx.fillRect(TX-24,TY-50,48,100);ctx.fillStyle='#3a4870';for(let i=0;i<3;i++)ctx.fillRect(TX-24+i*18,TY-62,12,14);
ctx.fillStyle='#2b3658';ctx.fillRect(TX-8,TY+16,16,34);ctx.fillStyle='#fde68a';ctx.fillRect(TX-4,TY-28,8,14);
if(flash>0){ctx.fillStyle='rgba(239,68,68,'+flash*.6+')';ctx.fillRect(TX-24,TY-62,48,112)}
ctx.shadowColor='#7c5cff';ctx.shadowBlur=18;ctx.fillStyle='#a78bfa';ctx.beginPath();ctx.arc(TX,TY-74,8+Math.sin(t*4)*1.5,0,7);ctx.fill();ctx.shadowBlur=0;
enemies.forEach(e=>{const by=e.y+Math.sin(t*8+e.ph)*2;
ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(e.x,e.y+11,9,3,0,0,7);ctx.fill();
ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(e.x,by,10,0,7);ctx.fill();
ctx.fillStyle='#fff';ctx.fillRect(e.x-7,by-4,5,5);ctx.fillRect(e.x,by-4,5,5);ctx.fillStyle='#111';ctx.fillRect(e.x-7,by-3,2,3);ctx.fillRect(e.x,by-3,2,3);
if(e.hp<e.max){ctx.fillStyle='#0b1020';ctx.fillRect(e.x-10,by-17,20,3);ctx.fillStyle='#22c55e';ctx.fillRect(e.x-10,by-17,20*Math.max(0,e.hp/e.max),3)}});
ctx.shadowColor='#38bdf8';ctx.shadowBlur=12;ctx.fillStyle='#e0f2fe';bolts.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()});ctx.shadowBlur=0;
ctx.textAlign='center';ctx.font='bold 12px system-ui';
parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;if(p.txt)ctx.fillText(p.txt,p.x,p.y);else ctx.fillRect(p.x-2,p.y-2,4,4)});ctx.globalAlpha=1;
const r=Math.max(0,hp/maxHp());ctx.fillStyle='rgba(11,16,32,.8)';ctx.fillRect(10,10,130,14);ctx.fillStyle=r>.35?'#22c55e':'#ef4444';ctx.fillRect(10,10,130*r,14);ctx.strokeStyle='#2b3658';ctx.strokeRect(10,10,130,14);
ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.fillText(Math.ceil(hp)+' / '+maxHp(),75,21);
ctx.textAlign='right';ctx.fillText(waveActive?enemies.length+' enemies left':'Ready for battle',W-10,21);ctx.textAlign='left'}
let last=0;function frame(ms){const dt=Math.min(.05,(ms-last)/1000);last=ms;update(dt);draw(ms/1000);requestAnimationFrame(frame)}
loadGame();hp=maxHp();renderAll();requestAnimationFrame(frame);
